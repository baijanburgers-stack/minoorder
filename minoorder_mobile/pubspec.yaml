name: minoorder_mobile
description: "MinoOrder Flutter POS & Kiosk high-performance Client. Owned by PlatePixels."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Enterprise State Management
  flutter_bloc: ^8.1.3
  
  # Reactive Data Persistence
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.17
  sembast: ^3.5.0+2
  
  # API Integrations
  supabase_flutter: ^2.5.5
  dio: ^5.4.0
  uuid: ^4.3.3
  
  # Local UI Styling & Localization
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
